name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Versión de Flutter
        run: flutter --version

      - name: Dependencias
        run: flutter pub get

      - name: Formato
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Análisis estático
        run: flutter analyze --fatal-infos

      - name: Tests unitarios y de widgets
        run: flutter test --coverage

      - name: Publicar cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: app/coverage/lcov.info
          if-no-files-found: ignore
