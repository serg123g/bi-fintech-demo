name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.9
          cache: true

      - name: Versión de Flutter
        run: flutter --version

      # firebase_options.dart y google-services.json no se versionan
      # (ADR-0011): se reconstruyen desde secrets en base64.
      - name: Config de Firebase desde secrets
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$FIREBASE_OPTIONS_DART" ] && [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$FIREBASE_OPTIONS_DART" | base64 --decode > lib/firebase_options.dart
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
          else
            # PRs de Dependabot y forks no reciben los secrets de Actions.
            # analyze/test no usan Firebase: basta un stub que compile (la app
            # real arrancaría sin push, ver main.dart).
            echo "::notice::Sin secrets de Firebase: se usa un stub para analyze/test"
            cat > lib/firebase_options.dart <<'DART'
          // Stub generado en CI (sin secrets). Ver ADR-0011.
          // ignore_for_file: type=lint
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;

          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform =>
                throw UnsupportedError('Firebase no configurado en este build');
          }
          DART
          fi

      - name: Dependencias
        run: flutter pub get

      - name: Formato (solo archivos versionados)
        run: dart format --output=none --set-exit-if-changed $(git ls-files '*.dart')

      - name: Análisis estático
        run: flutter analyze --fatal-infos

      - name: Tests unitarios y de widgets
        run: flutter test --coverage

      - name: Publicar cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: app/coverage/lcov.info
          if-no-files-found: ignore

  edge-functions:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Formato
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Typecheck
        run: deno check home-layout/index.ts send-push/index.ts assistant/index.ts

      - name: Tests (personalización y push)
        run: deno test --allow-env
