name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.9
          cache: true

      - name: Versión de Flutter
        run: flutter --version

      # firebase_options.dart y google-services.json no se versionan
      # (ADR-0011): se reconstruyen desde secrets en base64.
      - name: Config de Firebase desde secrets
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$FIREBASE_OPTIONS_DART" ] || [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Faltan los secrets FIREBASE_OPTIONS_DART / GOOGLE_SERVICES_JSON"
            exit 1
          fi
          echo "$FIREBASE_OPTIONS_DART" | base64 --decode > lib/firebase_options.dart
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json

      - name: Dependencias
        run: flutter pub get

      - name: Formato (solo archivos versionados)
        run: dart format --output=none --set-exit-if-changed $(git ls-files '*.dart')

      - name: Análisis estático
        run: flutter analyze --fatal-infos

      - name: Tests unitarios y de widgets
        run: flutter test --coverage

      - name: Publicar cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: app/coverage/lcov.info
          if-no-files-found: ignore

  edge-functions:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Formato
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Typecheck
        run: deno check home-layout/index.ts send-push/index.ts

      - name: Tests (personalización y push)
        run: deno test --allow-env
