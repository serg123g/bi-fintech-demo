name: fintech_platform
description: Plataforma financiera digital — prueba técnica Front-End (Flutter).
publish_to: 'none'
version: 1.1.0+1

environment:
  sdk: ^3.10.0
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  # Estado
  flutter_bloc: ^9.1.0
  equatable: ^2.0.5
  # Navegación
  go_router: ^16.0.0
  # Inyección de dependencias
  get_it: ^8.0.0
  # Backend (Auth, Postgres, Edge Functions)
  supabase_flutter: ^2.9.0
  # Sesión cifrada (Keychain / EncryptedSharedPreferences)
  flutter_secure_storage: ^9.2.4
  # Cache local cifrada (stale-while-revalidate)
  hive_ce: ^2.11.0
  hive_ce_flutter: ^2.3.0
  # Estado de red
  connectivity_plus: ^7.3.2
  # Acciones SDUI de tipo url
  url_launcher: ^6.3.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/sdui/
