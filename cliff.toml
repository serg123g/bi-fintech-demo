# Changelog generado desde Conventional Commits con git-cliff.
#   git cliff -o CHANGELOG.md            # completo
#   git cliff --latest --strip header    # solo la última versión (release)

[changelog]
header = """
# Changelog

Generado automáticamente desde los mensajes de commit ([Conventional Commits](https://www.conventionalcommits.org/)) con [git-cliff](https://git-cliff.org).\n
"""
body = """
{% if version %}\
## {{ version }} — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Sin publicar
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | trim }} ([`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/serg123g/bi-fintech-demo/commit/{{ commit.id }}))\
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->✨ Funcionalidades" },
  { message = "^fix", group = "<!-- 1 -->🐛 Correcciones" },
  { message = "^perf", group = "<!-- 2 -->⚡ Rendimiento" },
  { message = "^refactor", group = "<!-- 3 -->♻️ Refactor" },
  { message = "^test", group = "<!-- 4 -->🧪 Pruebas" },
  { message = "^docs", group = "<!-- 5 -->📝 Documentación" },
  { message = "^(ci|build)", group = "<!-- 6 -->⚙️ CI/CD y build" },
  { message = "^chore\\(deps\\)", group = "<!-- 7 -->📦 Dependencias" },
  { message = "^(chore|style)", group = "<!-- 8 -->🧹 Mantenimiento" },
]
